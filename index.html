<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soap Bar Daily Log - Weights Entry</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--ink:#12211c;--acc:#0b7a4b;--acc2:#0f9d61;--warn:#b23b3b;--line:#c9d6d0;--bg:#f2f6f4;--mut:#5d6f68;--amber:#b8791a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:10px 10px 44px;line-height:1.5}
.wrap{max-width:700px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.bar h1{flex:1 1 auto;margin:0;font-size:17px}
.ver{font-size:11.5px;font-weight:700;color:var(--mut);background:#e4ebe7;border-radius:20px;padding:3px 9px}
.mini{flex:0 0 auto;width:auto;margin:0;padding:7px 11px;font-size:12.5px;font-weight:700;background:#fff;color:var(--acc);border:1px solid var(--acc);border-radius:20px;cursor:pointer}
.mini.hot{background:var(--acc);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lnhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.lnhead b{font-size:15.5px}
.lnhead .t{font-size:13px;color:var(--mut);flex:1 1 auto}
.lnhead .n{font-size:11.5px;font-weight:700;color:var(--acc);background:#e4f5ec;border-radius:20px;padding:2px 9px}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px;color:#2c4239}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc2);outline-offset:1px}
input:disabled,input[readonly]{background:#eef3f0;color:var(--mut)}
.sel{display:flex;gap:8px}
.sel>div{flex:1 1 0;min-width:0}
.qc{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qc input{padding:9px 3px;font-size:15px;text-align:center}
.lines3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:start}
.lines3 .card{padding:8px 7px;margin:0;border-radius:11px}
.lines3 .lnhead{display:block;padding-bottom:6px;margin-bottom:7px}
.lines3 .lnhead b{display:block;font-size:13.5px}
.lines3 .lnhead .t{display:block;font-size:10.5px;line-height:1.3;margin:1px 0 3px}
.lines3 .lnhead .n{font-size:10px;padding:1px 7px}
.lines3 label{font-size:10.5px;margin:6px 0 3px}
.lines3 input{padding:8px 3px;font-size:15px}
.lines3 .qc{grid-template-columns:1fr;gap:4px}
.lines3 .qc input{padding:8px 3px;font-size:14px;text-align:center}
.lines3 .avg{display:block;margin-top:7px}
.lines3 .avg label{font-size:10.5px;margin:0 0 3px;display:block}
.lines3 .avg input{padding:8px 3px;font-size:14px;width:100%;text-align:center}
.wlist{display:flex;flex-direction:column;gap:4px;margin-top:3px;direction:ltr}
.wcell{display:flex;align-items:center;gap:5px;min-width:0}
.wcell>span{flex:0 0 22px;text-align:center;font-size:10.5px;font-weight:700;color:var(--mut);background:#eef3f0;border-radius:6px;padding:6px 0;line-height:1.2}
.wcell input{padding:8px 2px;font-size:15px;text-align:center;width:100%;min-width:0;letter-spacing:-.4px}
.wcell input.bad{border-color:var(--warn);background:#fdeaea}
.wcell input.fixed{border-color:var(--acc2);background:#e9f7f0}
.lines3 .msg{font-size:11px;padding:6px 7px}
.wlist::-webkit-scrollbar{height:5px}
.wlist::-webkit-scrollbar-thumb{background:#c9d6d0;border-radius:5px}
.avg{display:flex;align-items:center;gap:8px;margin-top:9px}
.avg label{margin:0;flex:0 0 auto;font-size:12.5px}
.avg input{text-align:center;font-weight:700;background:#eef3f0}
button{width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:11px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:#eef3f0;color:var(--ink);border:1px solid var(--line);font-size:14.5px;font-weight:700;padding:12px}
button.warnb{background:#fff;color:var(--warn);border:2px solid var(--warn)}
button:disabled{opacity:.5}
.msg{margin-top:9px;padding:9px 11px;border-radius:9px;font-size:13px;display:none;line-height:1.6}
.msg.ok{display:block;background:#e4f5ec;border:1px solid #7fbf9d;color:#0b5c38}
.msg.no{display:block;background:#fdeaea;border:1px solid #dfa0a0;color:#8d2b2b}
.msg.wn{display:block;background:#fff6e6;border:1px solid #e0b978;color:#8a5a10;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center}
th{background:#eef3f0}
.note{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px;text-align:center;font-size:11.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Soap Bar Daily Log — Weights Entry</h1>
    <span id="ver" class="ver"></span>
    <button id="upd" class="mini" type="button" hidden>⟳ Update</button>
  </div>

  <div class="card">
    <div class="sel">
      <div><label>Shift</label><select id="sh"><option value="1">A — 08:30</option><option value="2">B — 17:30</option><option value="3">C — 00:30</option></select></div>
      <div><label>Batch</label><select id="bt"><option value="1">1 (hours 1-3)</option><option value="2">2 (hours 4-6)</option><option value="3">3 (hours 7-8)</option></select></div>
      <div><label>Line 3</label><select id="vr"><option value="R">Royal</option><option value="L">Lemon</option></select></div>
    </div>
    <div class="note">One decimal becomes two (110.2 → 110.21) — on save or when you leave the box.</div>
  </div>

  <div id="lines"></div>

  <div class="card">
    <div class="msg" id="allwarn"></div>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px">
      <input type="checkbox" id="snd" style="width:auto;flex:0 0 auto">
      <span style="margin:0">🔔 Sound on save</span>
    </label>
    <button class="sec" id="clear" type="button">🗑 Clear all (except Batch No.)</button>
    <button class="sec" id="pull2" type="button">⟳ Pull values from cloud</button>
    <button class="sec" id="prev" type="button">Preview before saving</button>
    <button id="save" type="button">Save to app</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="pvCard" style="display:none">
    <label>Preview (before → after)</label>
    <div id="pv"></div>
  </div>
</div>
<div class="foot">Data encrypted AES-GCM · PIN 2780</div>
<script>
'use strict';
/* ---------------- settings ---------------- */
const CLOUD='https://soap-lab-shift-sync-default-rtdb.europe-west1.firebasedatabase.app/lab/soap-log-7c4e19a83b2f46d0a95e17cb.json';
const PIN='2780';
const VER='v13';
const LINES=[
  {ln:1,name:'Line 1 - Savannah',count:8,gm:110},
  {ln:2,name:'Line 2 - Savannah (771)',count:10,gm:110},
  {ln:3,name:'Line 3',count:0,gm:110}          /* Line 3: Royal = 6, Lemon = 5 */
];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
/* base64 in chunks: one call fails when the data grows
   (134KB used to throw RangeError: Maximum call stack size exceeded) */
const b64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
/* the weight: one decimal place becomes two (+0.01) */
const fixW=v=>{v=String(v==null?'':v).trim();if(/^-?\d+\.\d$/.test(v))return v+'1';if(/^-?\d+$/.test(v))return v+'.01';return v;};

/* ---------------- encryption and cloud ---------------- */
async function key(salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(PIN),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function load(){
  const r=await fetch(CLOUD,{cache:'no-store'});
  if(!r.ok)throw new Error('Could not read the file ('+r.status+')');
  const b=await r.json();
  if(!b||b.enc!=='aesgcm')throw new Error('The file is not encrypted');
  const k=await key(b.salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},k,unb64(b.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function put(plain){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await key(salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(plain)));
  const out={v:2,sv:2,enc:'aesgcm',salt:salt,iv:b64(iv),ct:b64(new Uint8Array(ct))};
  const r=await fetch(CLOUD,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});
  if(!r.ok)throw new Error('The write was refused ('+r.status+')');
}

/* ---------------- the lines ---------------- */
const lineCount=ln=>ln===3?($('#vr').value==='L'?5:6):LINES.find(l=>l.ln===ln).count;
const lineName=ln=>ln===3?($('#vr').value==='L'?'Line 3 - Savannah Lemon Blossom&Orange':'Line 3 - Royal (90-10)'):LINES.find(l=>l.ln===ln).name;
/* bucket: lines 1 and 2 share one, line 3 follows the product */
const bucket=id=>{
  const v=/l3/.test(id)?$('#vr').value:'';
  let m=id.match(/s(\d)b\d/);if(m)return 'S'+m[1]+v;
  m=id.match(/^[a-z]+(\d)l\d/);if(m)return 'S'+m[1]+v;
  return 'G'+v;
};
const wId=(ln,sh,bt,i)=>'l'+ln+'s'+sh+'b'+bt+'_c'+i;
const bnId=(ln,sh,bt)=>'l'+ln+'s'+sh+'b'+bt+'_bn';

function build(){
  const sh=$('#sh').value,bt=$('#bt').value;
  $('#lines').innerHTML='<div class="lines3">'+LINES.map(L=>{
    const n=lineCount(L.ln),ro=L.ln===2;      /* line 2 keeps the number from the original sheet */
    return '<div class="card" data-ln="'+L.ln+'">'
      +'<div class="lnhead"><b>Line '+L.ln+'</b><span class="t">'+lineName(L.ln)+'</span><span class="n">'+n+' soaps</span></div>'
      +'<label>Batch No.'+(ro?' (from the original sheet - you can change it)':'')+'</label>'
      +'<input class="bn" data-ln="'+L.ln+'" type="text" inputmode="numeric" placeholder="3100241611">'
      +'<label>Moisture / FA / FFA</label>'
      +'<div class="qc">'
      +'<input class="moi" data-ln="'+L.ln+'" type="text" inputmode="decimal" placeholder="Moisture">'
      +'<input class="faq" data-ln="'+L.ln+'" type="text" inputmode="decimal" placeholder="FA">'
      +'<input class="ffa" data-ln="'+L.ln+'" type="text" inputmode="decimal" placeholder="FFA">'
      +'</div>'
      +'<label>NET Weight '+L.gm+' GM</label>'
      +'<div class="wlist">'+[...Array(n)].map((_,i)=>'<div class="wcell"><span>'+(i+1)+'</span><input class="w" data-ln="'+L.ln+'" data-i="'+i+'" type="text" inputmode="decimal" placeholder="—"></div>').join('')+'</div>'
      +'<div class="avg"><label>Avgr</label><input class="avgv" data-ln="'+L.ln+'" readonly></div>'
      +'<div class="msg wn wl" data-ln="'+L.ln+'"></div>'
      +'</div>';
  }).join('')+'</div>';
  $$('.w').forEach(b=>{
    b.addEventListener('blur',()=>{const v=b.value.trim();if(v&&/^-?\d+(\.\d+)?$/.test(v)){const f=fixW(v);if(f!==v){b.value=f;b.classList.add('fixed');calc();}}});
    b.addEventListener('input',calc);
  });
  $$('.moi,.faq,.ffa,.bn').forEach(i=>i.addEventListener('input',calc));
  /* one tap on a box selects everything, so you type over it directly */
  $$('.w,.moi,.faq,.ffa,.bn').forEach(function(i){
   const sel=function(){try{if(this.value)this.select();}catch(e){}};
   i.addEventListener('focus',sel);
   i.addEventListener('click',function(){const el=this;setTimeout(function(){try{if(el.value)el.select();}catch(e){}},0)});
  });
  calc();
}
const weightsOf=ln=>$$('.w[data-ln="'+ln+'"]').map(b=>b.value.trim());
function calc(){
  const all=[];
  LINES.forEach(L=>{
    const ws=weightsOf(L.ln);
    const nums=ws.filter(x=>x!=='').map(parseFloat).filter(x=>!isNaN(x));
    const av=$$('.avgv[data-ln="'+L.ln+'"]')[0];
    if(av)av.value=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2):'';
    const miss=ws.map((x,i)=>x===''?i+1:0).filter(x=>x);
    $$('.w[data-ln="'+L.ln+'"]').forEach((b,i)=>b.classList.toggle('bad',ws[i]===''));
    const w=$$('.wl[data-ln="'+L.ln+'"]')[0];
    if(w){
      if(miss.length){w.className='msg wn wl';w.textContent='⚠️ Missing weight for '+miss.length+' soaps (no. '+miss.join(', ')+')';}
      else{w.className='msg wl';w.textContent='';}
    }
    if(miss.length)all.push('Line '+L.ln+' is missing '+miss.length+' weights (no. '+miss.join(', ')+')');
  });
  const aw=$('#allwarn');
  if(all.length){aw.className='msg wn';aw.textContent='⚠️ '+all.join(' — ')+' — fill them all before saving';}
  else{aw.className='msg';aw.textContent='';}
  return all;
}

/* ---------------- read the saved values ---------------- */
async function loadValues(){
  const sh=$('#sh').value,bt=$('#bt').value;
  try{
    const plain=await load();
    const nb={};
    LINES.forEach(L=>{
      const bk=bucket(wId(L.ln,sh,bt,0));
      const v=(plain.b[bk]&&plain.b[bk].v)||{};
      weightsOf(L.ln).forEach((_,i)=>{
        const id=wId(L.ln,sh,bt,i);
        const el=$$('.w[data-ln="'+L.ln+'"][data-i="'+i+'"]')[0];
        if(el){el.value=v[id]||'';el.classList.remove('fixed');}
        nb[id]=v[id]||'';
      });
      const num=v=>{const s=String(v==null?'':v).trim();return (s!==''&&isFinite(+s))?s:'';};
      /* the app reads the QC from the batch keys (l{line}s{shift}b{batch}_m/_fa/_ffa);
         the old line keys stay as a fallback for the values that were written before */
      const qcIds=[['moi','_m'],['faq','_fa'],['ffa','_ffa']].map(([k,suf])=>[k,'l'+L.ln+'s'+sh+'b'+bt+suf]);
      qcIds.forEach(([k,bid])=>{
        const el=$$('.'+k+'[data-ln="'+L.ln+'"]')[0];
        const val2=(v[bid]!==undefined&&v[bid]!=='')?v[bid]:v[k+sh+'l'+L.ln];
        if(el){el.value=num(val2);nb[bid]=el.value;nb[k+sh+'l'+L.ln]=el.value;}
      });
      const bn=$$('.bn[data-ln="'+L.ln+'"]')[0];if(bn){bn.value=v[bnId(L.ln,sh,bt)]||'';nb[bnId(L.ln,sh,bt)]=bn.value;}
    });
    baseVals=nb;
    calc();
  }catch(e){}
}

/* ---------------- build what will be written ---------------- */
function rows(){
  const sh=$('#sh').value,bt=$('#bt').value,out=[];
  /* only the values that are really different from the ones on the cloud:
     the page never writes an old number over a newer one */
  const add=(id,val,ln)=>{if(val!==''&&val!==baseVals[id])out.push({id:id,val:val,ln:ln});};
  LINES.forEach(L=>{
    weightsOf(L.ln).forEach((v,i)=>add(wId(L.ln,sh,bt,i),v,L.ln));
    [['moi','_m'],['faq','_fa'],['ffa','_ffa']].forEach(([k,suf])=>{
      const el=$$('.'+k+'[data-ln="'+L.ln+'"]')[0];if(!el)return;
      const v2=el.value.trim();
      add(k+sh+'l'+L.ln,v2,L.ln);
      /* the batch keys are the ones the app reads - this is what makes the
         Moisture / FA / FFA typed here really reach the app */
      add('l'+L.ln+'s'+sh+'b'+bt+suf,v2,L.ln);
    });
    /* Batch No.: optional for every line - if empty nothing is written
       and the original sheet keeps its own number */
    add(bnId(L.ln,sh,bt),$$('.bn[data-ln="'+L.ln+'"]')[0].value.trim(),L.ln);
  });
  return out;
}

/* ---------------- sound and messages ---------------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function beep(kind){
  if(localStorage.getItem('qe_sound')==='0')return;
  const c=ac();if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.connect(g);g.connect(c.destination);
    if(kind==='ok'){
      o.type='sine';o.frequency.setValueAtTime(760,t);o.frequency.setValueAtTime(1040,t+0.10);o.frequency.setValueAtTime(1320,t+0.20);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);o.start(t);o.stop(t+0.44);
    }else{
      o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(190,t+0.16);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.36);o.start(t);o.stop(t+0.38);
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(kind==='ok'?[45,60,45]:[220,90,220]);}catch(e){}
}
function say(txt,cls){const m=$('#msg');m.className='msg '+cls;m.textContent=txt;if(cls==='ok')setTimeout(()=>{m.className='msg'},6000);}

/* ---------------- auto update ---------------- */
function initSW(){
  if(!('serviceWorker' in navigator))return;
  let reg=null,refreshing=false;
  const mark=()=>{const u=$('#upd');u.hidden=false;u.classList.add('hot');u.textContent='⟳ Update available';};
  navigator.serviceWorker.register('sw.js').then(r=>{reg=r;
    if(r.waiting&&navigator.serviceWorker.controller)mark();
    r.addEventListener('updatefound',()=>{const nw=r.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)mark();});});
    setInterval(()=>{r.update().catch(()=>{});},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload();}});
  $('#upd').addEventListener('click',()=>{
    if(reg&&reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});return;}
    location.replace(location.pathname+'?v='+Date.now());
  });
}

/* ---------------- events ---------------- */
['sh','bt','vr'].forEach(id=>$('#'+id).addEventListener('change',()=>{build();loadValues();}));
$('#snd').checked=localStorage.getItem('qe_sound')!=='0';
$('#snd').addEventListener('change',()=>{localStorage.setItem('qe_sound',$('#snd').checked?'1':'0');if($('#snd').checked)beep('ok');});

$('#pull2').addEventListener('click',async()=>{
  const b=$('#pull2');b.disabled=true;b.textContent='Pulling...';
  try{await loadValues();say('Saved values pulled','ok');beep('ok');}
  catch(e){say('Pull failed: '+e.message,'no');beep('no');}
  b.disabled=false;b.textContent='⟳ Pull values from cloud';
});

let forced=false;
/* the values that came from the cloud: the save writes only what changed,
   so the page can never write an old value over a newer one */
let baseVals={};
/* the values that were cleared: they are removed from the cloud on the next save */
let pendKill=[];
/* the native confirm() is not used here: on some phones it is blocked or closed
   by mistake and the button looks like it does nothing.
   The screen is cleared at once, the cloud is only touched by "Save to app". */
$('#clear').addEventListener('click',()=>{
  const sh=$('#sh').value,bt=$('#bt').value;
  /* everything on the screen except the Batch No. */
  $$('.w').forEach(x=>{x.value='';x.classList.remove('fixed','bad')});
  $$('.moi,.faq,.ffa').forEach(x=>x.value='');
  $$('.avgv').forEach(x=>x.value='');
  /* remember what has to be removed from the cloud on the next save */
  pendKill=[];
  LINES.forEach(L=>{
    const n=lineCount(L.ln);
    for(let i=0;i<n;i++){const id=wId(L.ln,sh,bt,i);pendKill.push({id:id,bk:bucket(id)});}
    ['moi','faq','ffa'].forEach(k=>{const id=k+sh+'l'+L.ln;pendKill.push({id:id,bk:bucket(id)});});
    ['_m','_fa','_ffa'].forEach(suf=>{const id='l'+L.ln+'s'+sh+'b'+bt+suf;pendKill.push({id:id,bk:bucket(id)});});
  });
  calc();
  say('Everything cleared except the Batch No. - press "Save to app" to remove it from the app too (or "Pull values from cloud" to bring it back)','ok');
  beep('ok');
});
$('#prev').addEventListener('click',async()=>{
  const b=$('#save');b.disabled=true;
  try{
    const miss=calc();
    if(miss.length){say(miss.join(' — ')+' - fill the missing ones first','wn');b.disabled=false;return;}
    const plain=await load();const list=rows();
    if(!list.length)throw new Error('No values entered');
    const pv=list.map(x=>{const bk=bucket(x.id);const old=(plain.b[bk]&&plain.b[bk].v&&plain.b[bk].v[x.id])||'-';return{ln:x.ln,id:x.id,old:old,val:x.val};});
    $('#pvCard').style.display='';
    $('#pv').innerHTML='<table><tr><th>Line</th><th>Field</th><th>Before</th><th>After</th></tr>'
      +pv.map(r=>'<tr><td>'+r.ln+'</td><td>'+r.id+'</td><td>'+r.old+'</td><td><b>'+r.val+'</b></td></tr>').join('')+'</table>';
    say('Preview ready ('+pv.length+' values) - press save','ok');
  }catch(e){say(e.message,'no');}
  b.disabled=false;
});

$('#save').addEventListener('click',async()=>{
  ac();
  const miss=calc();
  /* when everything was cleared on purpose there is nothing to fill:
     the cleared values are the ones that get removed from the cloud */
  const emptyAll=!$$('.w').some(x=>x.value.trim()!=='');
  if(miss.length&&!forced&&!(pendKill.length&&emptyAll)){
    forced=true;$('#save').className='warnb';$('#save').textContent='Save anyway';
    say('⚠️ '+miss.join(' — ')+' - press again to save anyway','wn');return;
  }
  const b=$('#save');b.disabled=true;b.textContent='Saving...';
  try{
    /* one decimal place becomes two (even if the box was not left) */
    $$('.w').forEach(x=>{const v=x.value.trim();if(v&&/^-?\d+(\.\d+)?$/.test(v)){const f=fixW(v);if(f!==v)x.value=f;}});
    calc();
    const plain=await load();const list=rows();
    if(!list.length&&!pendKill.length)throw new Error('Nothing new to save');
    const now=Date.now();
    for(const x of list){
      const bk=bucket(x.id);
      plain.b=plain.b||{};const bb=plain.b[bk]||(plain.b[bk]={v:{},t:{}});bb.v=bb.v||{};
      bb.v[x.id]=x.val;
      plain.ts=plain.ts||{};plain.ts[bk]=now;
    }
    /* the cleared values are removed from the cloud - the Batch No. stays */
    let killed=0;
    pendKill.forEach(k=>{
      const bb=plain.b&&plain.b[k.bk];
      if(bb&&bb.v&&Object.prototype.hasOwnProperty.call(bb.v,k.id)){delete bb.v[k.id];killed++;}
    });
    await put(plain);
    const check=await load();
    let bad=0;for(const x of list){const bk=bucket(x.id);if(!check.b[bk].v||check.b[bk].v[x.id]!==x.val)bad++;}
    if(bad)throw new Error('Some values were not written ('+bad+')');
    pendKill=[];
    say((list.length?('Saved '+list.length+' values'):'Cleared')+(killed?(' - removed '+killed+' cleared values'):'')+' - open the app or wait 45 seconds','ok');beep('ok');
    $('#pvCard').style.display='none';
    await loadValues();
    forced=false;$('#save').className='';$('#save').textContent='Save to app';
  }catch(e){say(e.message,'no');beep('no');}
  b.disabled=false;if(b.textContent==='Saving...')b.textContent='Save to app';
});

$('#ver').textContent=VER;
initSW();
build();
loadValues();
</script>
</body>
</html>
