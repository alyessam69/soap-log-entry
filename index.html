<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تسجيل أوزان - صابون</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--ink:#12211c;--acc:#0b7a4b;--acc2:#0f9d61;--warn:#b23b3b;--line:#c9d6d0;--bg:#f2f6f4;--mut:#5d6f68;--amber:#b8791a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:10px 10px 44px;line-height:1.5}
.wrap{max-width:700px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.bar h1{flex:1 1 auto;margin:0;font-size:17px}
.ver{font-size:11.5px;font-weight:700;color:var(--mut);background:#e4ebe7;border-radius:20px;padding:3px 9px}
.mini{flex:0 0 auto;width:auto;margin:0;padding:7px 11px;font-size:12.5px;font-weight:700;background:#fff;color:var(--acc);border:1px solid var(--acc);border-radius:20px;cursor:pointer}
.mini.hot{background:var(--acc);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lnhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.lnhead b{font-size:15.5px}
.lnhead .t{font-size:13px;color:var(--mut);flex:1 1 auto}
.lnhead .n{font-size:11.5px;font-weight:700;color:var(--acc);background:#e4f5ec;border-radius:20px;padding:2px 9px}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px;color:#2c4239}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc2);outline-offset:1px}
input:disabled,input[readonly]{background:#eef3f0;color:var(--mut)}
.sel{display:flex;gap:8px}
.sel>div{flex:1 1 0;min-width:0}
.qc{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qc input{padding:9px 3px;font-size:15px;text-align:center}
.wlist{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.wrow{display:flex;align-items:center;gap:8px}
.wrow span{flex:0 0 30px;text-align:center;font-size:12.5px;font-weight:700;color:var(--mut);background:#eef3f0;border-radius:7px;padding:7px 0}
.wrow input{padding:9px 8px;font-size:16px;text-align:center}
.wrow input.bad{border-color:var(--warn);background:#fdeaea}
.wrow input.fixed{border-color:var(--acc2);background:#e9f7f0}
.avg{display:flex;align-items:center;gap:8px;margin-top:9px}
.avg label{margin:0;flex:0 0 auto;font-size:12.5px}
.avg input{text-align:center;font-weight:700;background:#eef3f0}
button{width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:11px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:#eef3f0;color:var(--ink);border:1px solid var(--line);font-size:14.5px;font-weight:700;padding:12px}
button.warnb{background:#fff;color:var(--warn);border:2px solid var(--warn)}
button:disabled{opacity:.5}
.msg{margin-top:9px;padding:9px 11px;border-radius:9px;font-size:13px;display:none;line-height:1.6}
.msg.ok{display:block;background:#e4f5ec;border:1px solid #7fbf9d;color:#0b5c38}
.msg.no{display:block;background:#fdeaea;border:1px solid #dfa0a0;color:#8d2b2b}
.msg.wn{display:block;background:#fff6e6;border:1px solid #e0b978;color:#8a5a10;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center}
th{background:#eef3f0}
.note{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px;text-align:center;font-size:11.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>تسجيل أوزان — صابون</h1>
    <span id="ver" class="ver"></span>
    <button id="upd" class="mini" type="button" hidden>⟳ تحديث</button>
  </div>

  <div class="card">
    <div class="sel">
      <div><label>الشِفت</label><select id="sh"><option value="1">A — 08:30</option><option value="2">B — 17:30</option><option value="3">C — 00:30</option></select></div>
      <div><label>الدفعة</label><select id="bt"><option value="1">1 (ساعات 1-3)</option><option value="2">2 (ساعات 4-6)</option><option value="3">3 (ساعات 7-8)</option></select></div>
      <div><label>الخط 3</label><select id="vr"><option value="R">Royal</option><option value="L">Lemon</option></select></div>
    </div>
    <div class="note">الوزن بخانة عشرية واحدة بيتحوّل بخانتين (110.2 → 110.21) — في الحفظ أو لما تسيب الخانة.</div>
  </div>

  <div id="lines"></div>

  <div class="card">
    <div class="msg" id="allwarn"></div>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px">
      <input type="checkbox" id="snd" style="width:auto;flex:0 0 auto">
      <span style="margin:0">🔔 صوت عند الحفظ</span>
    </label>
    <button class="sec" id="pull2" type="button">⟳ سحب القيم من الـ cloud</button>
    <button class="sec" id="prev" type="button">معاينة قبل الحفظ</button>
    <button id="save" type="button">حفظ في التطبيق</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="pvCard" style="display:none">
    <label>المعاينة (قبل → بعد)</label>
    <div id="pv"></div>
  </div>
</div>
<div class="foot">الداتا مشفّرة AES-GCM · PIN 2780</div>
<script>
'use strict';
/* ---------------- إعدادات ---------------- */
const CLOUD='https://soap-lab-shift-sync-default-rtdb.europe-west1.firebasedatabase.app/lab/soap-log-7c4e19a83b2f46d0a95e17cb.json';
const PIN='2780';
const VER='v6';
const LINES=[
  {ln:1,name:'Savannah',count:8},
  {ln:2,name:'Savannah (771)',count:10},
  {ln:3,name:'Line 3',count:0}          /* الخط 3: Royal=6 ، Lemon=5 */
];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const b64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
/* الوزن: خانة عشرية واحدة -> خانتين (+0.01) */
const fixW=v=>{v=String(v==null?'':v).trim();if(/^-?\d+\.\d$/.test(v))return v+'1';if(/^-?\d+$/.test(v))return v+'.01';return v;};

/* ---------------- التشفير والسحابة ---------------- */
async function key(salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(PIN),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function load(){
  const r=await fetch(CLOUD,{cache:'no-store'});
  if(!r.ok)throw new Error('تعذر قراءة الملف ('+r.status+')');
  const b=await r.json();
  if(!b||b.enc!=='aesgcm')throw new Error('الملف مش مشفّر');
  const k=await key(b.salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},k,unb64(b.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function put(plain){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await key(salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(plain)));
  const out={v:2,sv:2,enc:'aesgcm',salt:salt,iv:b64(iv),ct:b64(new Uint8Array(ct))};
  const r=await fetch(CLOUD,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});
  if(!r.ok)throw new Error('الكتابة رفضت ('+r.status+')');
}

/* ---------------- الأقسام ---------------- */
const lineCount=ln=>ln===3?($('#vr').value==='L'?5:6):LINES.find(l=>l.ln===ln).count;
const lineName=ln=>ln===3?($('#vr').value==='L'?'Lemon Blossom & Orange':'Royal (90-10)'):LINES.find(l=>l.ln===ln).name;
/* bucket: الخط 1 و 2 مشترك، الخط 3 حسب المنتج */
const bucket=id=>{
  const v=/l3/.test(id)?$('#vr').value:'';
  let m=id.match(/s(\d)b\d/);if(m)return 'S'+m[1]+v;
  m=id.match(/^[a-z]+(\d)l\d/);if(m)return 'S'+m[1]+v;
  return 'G'+v;
};
const wId=(ln,sh,bt,i)=>'l'+ln+'s'+sh+'b'+bt+'_c'+i;
const bnId=(ln,sh,bt)=>'l'+ln+'s'+sh+'b'+bt+'_bn';

function build(){
  const sh=$('#sh').value,bt=$('#bt').value;
  $('#lines').innerHTML=LINES.map(L=>{
    const n=lineCount(L.ln),ro=L.ln===2;      /* الخط التاني: الـ batch no بتاعه مش بيتغير من هنا */
    return '<div class="card" data-ln="'+L.ln+'">'
      +'<div class="lnhead"><b>الخط '+L.ln+'</b><span class="t">'+lineName(L.ln)+'</span><span class="n">'+n+' قالب</span></div>'
      +'<label>Batch No.'+(ro?' — للشيت الأصلي (مش بيتغير من هنا)':'')+'</label>'
      +'<input class="bn" data-ln="'+L.ln+'" type="text" inputmode="numeric" placeholder="مثال: 3100241611"'+(ro?' readonly':'')+'>'
      +'<label>التحاليل</label>'
      +'<div class="qc">'
      +'<input class="moi" data-ln="'+L.ln+'" type="text" inputmode="decimal" placeholder="Moisture">'
      +'<input class="faq" data-ln="'+L.ln+'" type="text" inputmode="decimal" placeholder="FA">'
      +'<input class="ffa" data-ln="'+L.ln+'" type="text" inputmode="decimal" placeholder="FFA">'
      +'</div>'
      +'<label>الأوزان</label>'
      +'<div class="wlist">'+[...Array(n)].map((_,i)=>'<div class="wrow"><span>'+(i+1)+'</span><input class="w" data-ln="'+L.ln+'" data-i="'+i+'" type="text" inputmode="decimal" placeholder="—"></div>').join('')+'</div>'
      +'<div class="avg"><label>المتوسط (Avgr)</label><input class="avgv" data-ln="'+L.ln+'" readonly></div>'
      +'<div class="msg wn wl" data-ln="'+L.ln+'"></div>'
      +'</div>';
  }).join('');
  $$('.w').forEach(b=>{
    b.addEventListener('blur',()=>{const v=b.value.trim();if(v&&/^-?\d+(\.\d+)?$/.test(v)){const f=fixW(v);if(f!==v){b.value=f;b.classList.add('fixed');calc();}}});
    b.addEventListener('input',calc);
  });
  $$('.moi,.faq,.ffa,.bn').forEach(i=>i.addEventListener('input',calc));
  calc();
}
const weightsOf=ln=>$$('.w[data-ln="'+ln+'"]').map(b=>b.value.trim());
function calc(){
  const all=[];
  LINES.forEach(L=>{
    const ws=weightsOf(L.ln);
    const nums=ws.filter(x=>x!=='').map(parseFloat).filter(x=>!isNaN(x));
    const av=$$('.avgv[data-ln="'+L.ln+'"]')[0];
    if(av)av.value=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2):'';
    const miss=ws.map((x,i)=>x===''?i+1:0).filter(x=>x);
    $$('.w[data-ln="'+L.ln+'"]').forEach((b,i)=>b.classList.toggle('bad',ws[i]===''));
    const w=$$('.wl[data-ln="'+L.ln+'"]')[0];
    if(w){
      if(miss.length){w.className='msg wn wl';w.textContent='⚠️ ناقص وزن لـ '+miss.length+' قالب (رقم '+miss.join('، ')+')';}
      else{w.className='msg wl';w.textContent='';}
    }
    if(miss.length)all.push('الخط '+L.ln+' ناقصه '+miss.length+' وزن (رقم '+miss.join('، ')+')');
  });
  const aw=$('#allwarn');
  if(all.length){aw.className='msg wn';aw.textContent='⚠️ '+all.join(' — ')+' — لازم تكتبهم كلهم قبل الحفظ';}
  else{aw.className='msg';aw.textContent='';}
  return all;
}

/* ---------------- قراءة القيم المحفوظة ---------------- */
async function loadValues(){
  const sh=$('#sh').value,bt=$('#bt').value;
  try{
    const plain=await load();
    LINES.forEach(L=>{
      const bk=bucket(wId(L.ln,sh,bt,0));
      const v=(plain.b[bk]&&plain.b[bk].v)||{};
      weightsOf(L.ln).forEach((_,i)=>{
        const el=$$('.w[data-ln="'+L.ln+'"][data-i="'+i+'"]')[0];
        if(el){el.value=v[wId(L.ln,sh,bt,i)]||'';el.classList.remove('fixed');}
      });
      const moi=$$('.moi[data-ln="'+L.ln+'"]')[0];if(moi)moi.value=v['moi'+sh+'l'+L.ln]||'';
      const faq=$$('.faq[data-ln="'+L.ln+'"]')[0];if(faq)faq.value=v['faq'+sh+'l'+L.ln]||'';
      const ffa=$$('.ffa[data-ln="'+L.ln+'"]')[0];if(ffa)ffa.value=v['ffa'+sh+'l'+L.ln]||'';
      const bn=$$('.bn[data-ln="'+L.ln+'"]')[0];if(bn)bn.value=v[bnId(L.ln,sh,bt)]||'';
    });
    calc();
  }catch(e){}
}

/* ---------------- تجهيز اللي هيتكتب ---------------- */
function rows(){
  const sh=$('#sh').value,bt=$('#bt').value,out=[];
  LINES.forEach(L=>{
    weightsOf(L.ln).forEach((v,i)=>{if(v!=='')out.push({id:wId(L.ln,sh,bt,i),val:v,ln:L.ln});});
    const moi=$$('.moi[data-ln="'+L.ln+'"]')[0].value.trim();
    const faq=$$('.faq[data-ln="'+L.ln+'"]')[0].value.trim();
    const ffa=$$('.ffa[data-ln="'+L.ln+'"]')[0].value.trim();
    if(moi!=='')out.push({id:'moi'+sh+'l'+L.ln,val:moi,ln:L.ln});
    if(faq!=='')out.push({id:'faq'+sh+'l'+L.ln,val:faq,ln:L.ln});
    if(ffa!=='')out.push({id:'ffa'+sh+'l'+L.ln,val:ffa,ln:L.ln});
    /* الـ Batch No.: الخط 1 و 3 بس، اختياري — لو فاضي ما فيكتبش حاجة (اللي في الشيت الأصلي يفضل زي ما هو) */
    if(L.ln!==2){
      const bn=$$('.bn[data-ln="'+L.ln+'"]')[0].value.trim();
      if(bn!=='')out.push({id:bnId(L.ln,sh,bt),val:bn,ln:L.ln});
    }
  });
  return out;
}

/* ---------------- الصوت والرسائل ---------------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function beep(kind){
  if(localStorage.getItem('qe_sound')==='0')return;
  const c=ac();if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.connect(g);g.connect(c.destination);
    if(kind==='ok'){
      o.type='sine';o.frequency.setValueAtTime(760,t);o.frequency.setValueAtTime(1040,t+0.10);o.frequency.setValueAtTime(1320,t+0.20);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);o.start(t);o.stop(t+0.44);
    }else{
      o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(190,t+0.16);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.36);o.start(t);o.stop(t+0.38);
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(kind==='ok'?[45,60,45]:[220,90,220]);}catch(e){}
}
function say(txt,cls){const m=$('#msg');m.className='msg '+cls;m.textContent=txt;if(cls==='ok')setTimeout(()=>{m.className='msg'},6000);}

/* ---------------- التحديث التلقائي ---------------- */
function initSW(){
  if(!('serviceWorker' in navigator))return;
  let reg=null,refreshing=false;
  const mark=()=>{const u=$('#upd');u.hidden=false;u.classList.add('hot');u.textContent='⟳ تحديث متاح';};
  navigator.serviceWorker.register('sw.js').then(r=>{reg=r;
    if(r.waiting&&navigator.serviceWorker.controller)mark();
    r.addEventListener('updatefound',()=>{const nw=r.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)mark();});});
    setInterval(()=>{r.update().catch(()=>{});},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload();}});
  $('#upd').addEventListener('click',()=>{
    if(reg&&reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});return;}
    location.replace(location.pathname+'?v='+Date.now());
  });
}

/* ---------------- الأحداث ---------------- */
['sh','bt','vr'].forEach(id=>$('#'+id).addEventListener('change',()=>{build();loadValues();}));
$('#snd').checked=localStorage.getItem('qe_sound')!=='0';
$('#snd').addEventListener('change',()=>{localStorage.setItem('qe_sound',$('#snd').checked?'1':'0');if($('#snd').checked)beep('ok');});

$('#pull2').addEventListener('click',async()=>{
  const b=$('#pull2');b.disabled=true;b.textContent='جاري السحب...';
  try{await loadValues();say('تم سحب القيم المحفوظة','ok');beep('ok');}
  catch(e){say('فشل السحب: '+e.message,'no');beep('no');}
  b.disabled=false;b.textContent='⟳ سحب القيم من الـ cloud';
});

let forced=false;
$('#prev').addEventListener('click',async()=>{
  const b=$('#save');b.disabled=true;
  try{
    const miss=calc();
    if(miss.length){say(miss.join(' — ')+' — كمّل الأول','wn');b.disabled=false;return;}
    const plain=await load();const list=rows();
    if(!list.length)throw new Error('مفيش قيم مكتوبة');
    const pv=list.map(x=>{const bk=bucket(x.id);const old=(plain.b[bk]&&plain.b[bk].v&&plain.b[bk].v[x.id])||'-';return{ln:x.ln,id:x.id,old:old,val:x.val};});
    $('#pvCard').style.display='';
    $('#pv').innerHTML='<table><tr><th>الخط</th><th>الخانة</th><th>قبل</th><th>بعد</th></tr>'
      +pv.map(r=>'<tr><td>'+r.ln+'</td><td>'+r.id+'</td><td>'+r.old+'</td><td><b>'+r.val+'</b></td></tr>').join('')+'</table>';
    say('المعاينة جاهزة ('+pv.length+' قيمة) - اضغط حفظ','ok');
  }catch(e){say(e.message,'no');}
  b.disabled=false;
});

$('#save').addEventListener('click',async()=>{
  ac();
  const miss=calc();
  if(miss.length&&!forced){
    forced=true;$('#save').className='warnb';$('#save').textContent='احفظ رغم النقص';
    say('⚠️ '+miss.join(' — ')+' — لو مفعتش تضغط تاني عشان تحفظ','wn');return;
  }
  const b=$('#save');b.disabled=true;b.textContent='جاري الحفظ...';
  try{
    /* خانة عشرية واحدة -> خانتين (حتى لو ما سيبتش الخانة) */
    $$('.w').forEach(x=>{const v=x.value.trim();if(v&&/^-?\d+(\.\d+)?$/.test(v)){const f=fixW(v);if(f!==v)x.value=f;}});
    calc();
    const plain=await load();const list=rows();
    if(!list.length)throw new Error('مفيش قيم مكتوبة');
    const now=Date.now();
    for(const x of list){
      const bk=bucket(x.id);
      plain.b=plain.b||{};const bb=plain.b[bk]||(plain.b[bk]={v:{},t:{}});bb.v=bb.v||{};
      bb.v[x.id]=x.val;
      plain.ts=plain.ts||{};plain.ts[bk]=now;
    }
    await put(plain);
    const check=await load();
    let bad=0;for(const x of list){const bk=bucket(x.id);if(!check.b[bk].v||check.b[bk].v[x.id]!==x.val)bad++;}
    if(bad)throw new Error('بعض القيم مااتكتبتش ('+bad+')');
    say('تم تسجيل '+list.length+' قيمة بنجاح - افتح التطبيق أو استنى 45 ثانية','ok');beep('ok');
    $('#pvCard').style.display='none';
    await loadValues();
    forced=false;$('#save').className='';$('#save').textContent='حفظ في التطبيق';
  }catch(e){say(e.message,'no');beep('no');}
  b.disabled=false;if(b.textContent==='جاري الحفظ...')b.textContent='حفظ في التطبيق';
});

$('#ver').textContent=VER;
initSW();
build();
loadValues();
</script>
</body>
</html>
